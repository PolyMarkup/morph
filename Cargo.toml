[workspace]
members = [
    "crates/morph-core",
    "crates/morph-cli",
    "crates/morph-web",
]
default-members = [
    "crates/morph-core",
    "crates/morph-cli",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/polymarkup/morph"

[workspace.dependencies]
pretty_assertions = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
