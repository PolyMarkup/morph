name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_call:
    inputs:
      plan:
        description: The dist release plan
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/morph-web/package-lock.json
      - name: Install web dependencies
        working-directory: crates/morph-web
        run: npm ci
      - name: Test and build web frontend
        working-directory: crates/morph-web
        run: npm run validate
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Install Worker build tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --version 0.7.4 --locked
      - name: Build Worker
        working-directory: crates/morph-web
        run: worker-build --release

  deploy-web:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: morph-web-production
      cancel-in-progress: false
    environment:
      name: morph-web-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/morph-web/package-lock.json
      - name: Install web dependencies
        working-directory: crates/morph-web
        run: npm ci
      - name: Install Worker build tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --version 0.7.4 --locked
      - name: Deploy web workbench
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.116.0"
          workingDirectory: crates/morph-web
          command: deploy
      - name: Report missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: >-
          echo "::notice::Web deployment skipped because its Cloudflare repository secrets are not configured."
